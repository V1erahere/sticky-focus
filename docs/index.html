<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
:root {
  --bg:      #FDF6EE;
  --paper:   #FEFCF8;
  --ember:   #C83C0A;
  --teal:    #5BBFB5;
  --ink:     #1A1826;
  --ink-mid: #4C4A6A;
  --muted:   #9494B8;
  --line:    #C0D1ED;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

/* ── Hero ── */
.hero {
  width: 100%;
  background: #FBF0E6;
  position: relative;
}
.hero img {
  width: 100%;
  max-width: 1440px;
  display: block;
  margin: 0 auto;
}

/* ── Download bar ── */
.dl-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 28px 24px;
  background: var(--ember);
  flex-wrap: wrap;
}
.dl-bar-text {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.02em;
}
.dl-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 28px;
  background: #fff;
  color: var(--ember);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  border-radius: 3px;
  text-decoration: none;
  letter-spacing: 0.01em;
  transition: opacity .15s;
}
.dl-btn:hover { opacity: 0.88; }
.dl-btn svg { flex-shrink: 0; }

/* ── Section: problem ── */
.section-problem {
  background: var(--ember);
  padding: 0;
}
.section-problem img {
  width: 100%;
  max-width: 1440px;
  display: block;
  margin: 0 auto;
}

/* ── Section: feature ── */
.section-feature {
  background: var(--bg);
  padding: 0;
}
.section-feature img {
  width: 100%;
  max-width: 1440px;
  display: block;
  margin: 0 auto;
}

/* ── Section: feature2 ── */
.section-feature2 {
  background: #C8C0E0;
  padding: 0;
}
.section-feature2 img {
  width: 100%;
  max-width: 1440px;
  display: block;
  margin: 0 auto;
}

/* ── Section: closing ── */
.section-closing {
  background: #5BBFB5;
  padding: 0;
}
.section-closing img {
  width: 100%;
  max-width: 1440px;
  display: block;
  margin: 0 auto;
}

/* ── Footer ── */
footer {
  background: var(--ink);
  color: #fff;
  padding: 32px 24px;
  text-align: center;
}
.footer-inner {
  max-width: 600px;
  margin: 0 auto;
}
.footer-title {
  font-family: 'Caveat', cursive;
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 6px;
}
.footer-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.55);
  margin-bottom: 20px;
}
.footer-links {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}
.footer-link {
  color: rgba(255,255,255,0.70);
  text-decoration: none;
  font-size: 13px;
  transition: color .15s;
}
.footer-link:hover { color: #fff; }

/* ── Second dl button ── */
.dl-bar-2 {
  display: flex;
  justify-content: center;
  padding: 40px 24px;
  background: var(--bg);
}
.dl-btn-2 {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 36px;
  background: var(--ember);
  color: #fff;
  font-family: 'Caveat', cursive;
  font-size: 22px;
  font-weight: 700;
  border-radius: 4px;
  text-decoration: none;
  letter-spacing: 0.02em;
  transition: opacity .15s;
  box-shadow: 0 4px 18px rgba(200,60,10,0.25);
}
.dl-btn-2:hover { opacity: 0.88; }
</style>
</head>
<body>

<!-- Hero banner -->
<section class="hero">
  <img src="img/hero.png" alt="Sticky Focus — tasks, subtasks, focus timer">
</section>

<!-- Download bar -->
<div class="dl-bar">
  <span class="dl-bar-text">Free Windows desktop widget · no install needed</span>
  <a href="https://github.com/V1erahere/sticky-focus/releases/latest" class="dl-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 16l-6-6h4V4h4v6h4l-6 6zm-8 4h16v-2H4v2z"/>
    </svg>
    Download for Windows
  </a>
</div>

<!-- Problem section -->
<section class="section-problem">
  <img src="img/problem.png" alt="Without focus — distractions everywhere">
</section>

<!-- Feature 1: app in context -->
<section class="section-feature">
  <img src="img/feature1.png" alt="Sticky Focus in action">
</section>

<!-- Feature 2: detailed features -->
<section class="section-feature2">
  <img src="img/feature2.png" alt="Tasks, subtasks, themes — Sticky Focus features">
</section>

<!-- Second download button -->
<div class="dl-bar-2">
  <a href="https://github.com/V1erahere/sticky-focus/releases/latest" class="dl-btn-2">
    ↓ Download Sticky Focus
  </a>
</div>

<!-- Closing -->
<section class="section-closing">
  <img src="img/closing.png" alt="Stay focused and calm">
</section>

<!-- Footer -->
<footer>
  <div class="footer-inner">
    <div class="footer-title">Sticky Focus</div>
    <div class="footer-sub">Made with ♥ by Vera Kashtanova</div>
    <div class="footer-links">
      <a href="https://github.com/V1erahere/sticky-focus" class="footer-link">GitHub →</a>
      <a href="https://github.com/V1erahere/sticky-focus/releases" class="footer-link">Releases →</a>
      <a href="https://github.com/V1erahere/sticky-focus/issues" class="footer-link">Report a bug →</a>
    </div>
  </div>
</footer>

</body>
</html>
